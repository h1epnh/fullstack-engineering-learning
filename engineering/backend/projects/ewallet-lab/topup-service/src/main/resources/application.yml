spring:
  application:
    name: ewallet-lab-topup-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:ewallet_topup}
    username: ${DB_USER:ewallet_topup}
    password: ${DB_PASSWORD:ewallet_topup}
    # Issue #24 — see user-service's application.yml for the full rationale.
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8092

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

ewallet-lab:
  topics:
    topup-confirmed: wallet.topup.confirmed
  bank-gateway:
    base-url: ${BANK_GATEWAY_URL:http://localhost:8093}
    # Issue #52: no defaults on purpose — fail at startup rather than fall back to a known secret.
    access-key: ${BANK_GATEWAY_ACCESS_KEY}
    secret-key: ${BANK_GATEWAY_SECRET_KEY}
  ipn:
    # Replay window for IPN responseTime (lab-defined control, see IpnSignatureVerifier).
    replay-window-seconds: ${IPN_REPLAY_WINDOW_SECONDS:300}
  wallet-service:
    base-url: ${WALLET_SERVICE_URL:http://localhost:8091}
  user-service:
    base-url: ${USER_SERVICE_URL:http://localhost:8090}
  self:
    base-url: ${SELF_BASE_URL:http://localhost:8092}
