version: "3.9"

services:
  # One Postgres instance, separate databases per service (schema-per-service — see DESIGN.md).
  postgres:
    image: postgres:16
    # Issue #24 — raised from the default 100; see helm values.yaml's postgres.maxConnections
    # comment for the pool-budget math (10 services x hikari.maximum-pool-size=5, doubled for
    # rolling-restart overlap).
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ewallet-lab-postgres:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql

  zookeeper:
    # Pinned: :latest now defaults to KRaft-only mode (no more ZOOKEEPER_* support), which broke
    # this compose file's Zookeeper-based config outright. 7.5.3 is the last widely-used line that
    # still runs classic Zookeeper mode with these env vars.
    image: confluentinc/cp-zookeeper:7.5.3
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    # Pinned for the same reason as zookeeper above — see that comment.
    image: confluentinc/cp-kafka:7.5.3
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9093:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  user-service:
    build: ./user-service
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8090:8090"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ewallet_user
      DB_USER: postgres
      DB_PASSWORD: postgres

  wallet-service:
    build: ./wallet-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8091:8091"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ewallet_wallet
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP: kafka:9092
      FAMILY_WALLET_SERVICE_URL: http://family-wallet-service:8100

  topup-service:
    build: ./topup-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mock-bank-gateway:
        condition: service_started
    ports:
      - "8092:8092"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ewallet_topup
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP: kafka:9092
      BANK_GATEWAY_URL: http://mock-bank-gateway:8093
      # Issue #52: shared accessKey/secretKey pair — must be IDENTICAL in topup-service and
      # mock-bank-gateway, since one signs the IPN and the other verifies it. The defaults are the
      # values come from a gitignored .env (copy .env.example, fill with random values); no default
      # on purpose so compose refuses to start rather than use a known secret.
      BANK_GATEWAY_ACCESS_KEY: ${BANK_GATEWAY_ACCESS_KEY:?set in .env, see .env.example}
      BANK_GATEWAY_SECRET_KEY: ${BANK_GATEWAY_SECRET_KEY:?set in .env, see .env.example}
      WALLET_SERVICE_URL: http://wallet-service:8091
      SELF_BASE_URL: http://topup-service:8092

  mock-bank-gateway:
    build: ./mock-bank-gateway
    ports:
      - "8093:8093"
    environment:
      HTTP_PORT: "8093"
      # Issue #52: the SAME pair topup-service gets above — this side signs the IPN.
      BANK_GATEWAY_ACCESS_KEY: ${BANK_GATEWAY_ACCESS_KEY:?set in .env, see .env.example}
      BANK_GATEWAY_SECRET_KEY: ${BANK_GATEWAY_SECRET_KEY:?set in .env, see .env.example}

  transfer-service:
    build: ./transfer-service
    depends_on:
      - user-service
      - wallet-service
    ports:
      - "8094:8094"
    environment:
      USER_SERVICE_URL: http://user-service:8090
      WALLET_SERVICE_URL: http://wallet-service:8091

  bill-payment-service:
    build: ./bill-payment-service
    depends_on:
      postgres:
        condition: service_healthy
      wallet-service:
        condition: service_started
    ports:
      - "8095:8095"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ewallet_bill_payment
      DB_USER: postgres
      DB_PASSWORD: postgres
      WALLET_SERVICE_URL: http://wallet-service:8091

  payment-request-service:
    build: ./payment-request-service
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started
      transfer-service:
        condition: service_started
    ports:
      - "8096:8096"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ewallet_payment_request
      DB_USER: postgres
      DB_PASSWORD: postgres
      USER_SERVICE_URL: http://user-service:8090
      TRANSFER_SERVICE_URL: http://transfer-service:8094

  lucky-money-service:
    build: ./lucky-money-service
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started
      wallet-service:
        condition: service_started
    ports:
      - "8097:8097"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ewallet_lucky_money
      DB_USER: postgres
      DB_PASSWORD: postgres
      USER_SERVICE_URL: http://user-service:8090
      WALLET_SERVICE_URL: http://wallet-service:8091

  bnpl-service:
    build: ./bnpl-service
    depends_on:
      postgres:
        condition: service_healthy
      wallet-service:
        condition: service_started
    ports:
      - "8098:8098"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ewallet_bnpl
      DB_USER: postgres
      DB_PASSWORD: postgres
      WALLET_SERVICE_URL: http://wallet-service:8091

  loyalty-service:
    build: ./loyalty-service
    depends_on:
      postgres:
        condition: service_healthy
      wallet-service:
        condition: service_started
    ports:
      - "8099:8099"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ewallet_loyalty
      DB_USER: postgres
      DB_PASSWORD: postgres
      WALLET_SERVICE_URL: http://wallet-service:8091

  # NOTE: originally also defaulted to port 8098 (a stashed branch that diverged from bnpl-service
  # before either was committed) — reassigned to 8100 to avoid colliding with bnpl-service above.
  family-wallet-service:
    build: ./family-wallet-service
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started
      wallet-service:
        condition: service_started
    ports:
      - "8100:8100"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ewallet_family_wallet
      DB_USER: postgres
      DB_PASSWORD: postgres
      USER_SERVICE_URL: http://user-service:8090
      WALLET_SERVICE_URL: http://wallet-service:8091

  # NOTE: originally also defaulted to port 8099 (same stashed-branch collision as
  # family-wallet-service above) — reassigned to 8101 to avoid colliding with loyalty-service.
  fund-service:
    build: ./fund-service
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started
      wallet-service:
        condition: service_started
    ports:
      - "8101:8101"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ewallet_fund
      DB_USER: postgres
      DB_PASSWORD: postgres
      USER_SERVICE_URL: http://user-service:8090
      WALLET_SERVICE_URL: http://wallet-service:8091

  investment-fund-service:
    build: ./investment-fund-service
    depends_on:
      postgres:
        condition: service_healthy
      wallet-service:
        condition: service_started
    ports:
      - "8102:8102"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ewallet_investment
      DB_USER: postgres
      DB_PASSWORD: postgres
      WALLET_SERVICE_URL: http://wallet-service:8091

volumes:
  ewallet-lab-postgres:

