spring:
  application:
    name: ewallet-lab-wallet-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:ewallet_wallet}
    username: ${DB_USER:ewallet_wallet}
    password: ${DB_PASSWORD:ewallet_wallet}
    # Issue #24 — see user-service's application.yml for the full rationale (Hikari default 10 x
    # ~10 services exhausted Postgres's default max_connections=100 twice).
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: wallet-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

server:
  port: 8091

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

ewallet-lab:
  topics:
    topup-confirmed: wallet.topup.confirmed
  # Điều 26 Thông tư 40/2024/TT-NHNN (sửa bởi Thông tư 41/2025/TT-NHNN) — hạn mức giao dịch
  # chuyển tiền/thanh toán qua ví điện tử tối đa 100.000.000đ/tháng dương lịch. Xem DESIGN.md
  # mục "Hạn mức giao dịch/tháng" (issue #7) — override-able for testing without waiting a
  # real month to roll over is NOT needed here (per-request @DecimalMax from issue #6 already
  # equals this monthly cap for TRANSFER_OUT, so 2 max-size transfers in the same month is
  # enough to exercise the "exceeded" path with real numbers).
  monthly-outbound-limit: 100000000
  # Issue #13 — "Túi Thần Tài" (savings pocket). Rate sourced from ZaloPay's "Tài Khoản Tích Lũy"
  # (fetched directly from zalopay.vn, 4%/năm) — NOT MoMo's ~6%/năm figure, which agent-designer
  # could only find via third-party search snippets, never verified directly against momo.vn. See
  # backend DESIGN.md's "Túi Thần Tài" section. accrual-period-seconds defaults to a real day
  # (86400s) — override-able for verification only (same "shrink a real duration, then revert"
  # pattern used for lucky-money's TTL in issue #10), NOT a change to the annual-rate math itself.
  savings-pocket:
    annual-rate: 0.04
    min-open-amount: 10000
    accrual-period-seconds: 86400
  # Issue #12 — "Ví Gia Đình". Read-only lookup wallet-service makes before every
  # TRANSFER_OUT/BILL_PAYMENT/WITHDRAW debit to check for a parent-set monthly limit. See
  # FamilyWalletServiceClient's javadoc for the fail-open behavior if this is unreachable.
  family-wallet-service:
    base-url: ${FAMILY_WALLET_SERVICE_URL:http://localhost:8098}
  # Issue #40 — eKYC tier (binary model, see WalletMutationExecutor.debitOnce's javadoc): UNVERIFIED
  # accounts are blocked from ANY outbound debit, VERIFIED accounts use monthly-outbound-limit above
  # as normal. No separate limit config needed for UNVERIFIED (not "a smaller monthly cap" anymore).
  user-service:
    base-url: ${USER_SERVICE_URL:http://localhost:8090}
    # Issue #55 — explicit timeouts so an unreachable user-service fails fast (fail-closed for money-OUT).
    connect-timeout-ms: ${USER_SERVICE_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${USER_SERVICE_READ_TIMEOUT_MS:2000}
  # ADR-06 (DESIGN.md) — SNS publish for the NEW "payment.completed" notification fan-out, a
  # second, isolated async layer (NOT a replacement for Kafka/Outbox). Credentials come from the
  # k8s Secret `ewallet-lab-aws-notify` (created out-of-band by the operator, see
  # scripts/init-aws-infra.sh), mounted via Helm's `envFrom.secretRef` — NOT from
  # ~/.aws/config or any instance profile. All 3 default to blank/disabled on purpose: a local
  # docker-compose run with no AWS credentials must keep working exactly as before, with SNS
  # publishing silently no-op'd (see PaymentNotificationPublisher).
  aws:
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
    region: ${AWS_DEFAULT_REGION:ap-southeast-1}
  sns:
    # Not secret (see values.yaml's aws.snsTopicArn comment) — the topic's own ARN.
    topic-arn: ${SNS_TOPIC_ARN:}

