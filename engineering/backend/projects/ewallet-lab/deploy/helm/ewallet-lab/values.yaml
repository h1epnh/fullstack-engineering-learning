# Base defaults, common to every environment. values-local.yaml / values-eks.yaml
# override the environment-specific bits (registry, ingress class, storage class).

namespace: ewallet-lab

image:
  registry: ""   # "" = use the image name as-is (works with images built straight into
                 # minikube's own docker daemon). Real EKS would set this to an ECR URI,
                 # e.g. "123456789012.dkr.ecr.ap-southeast-1.amazonaws.com/"
  pullPolicy: IfNotPresent
  tag: local

ingress:
  className: nginx
  # Issue #41: TLS added alongside plain HTTP (WebAuthn/`navigator.credentials` only exists in a
  # "secure context" — HTTPS or `localhost` — so Touch ID step-up needs *.ewallet-lab.local served
  # over HTTPS too). `ssl-redirect: "false"` is REQUIRED here, not optional: ingress-nginx defaults
  # to force-redirecting HTTP->HTTPS as soon as any `tls:` block exists on an Ingress, which would
  # break every existing `http://*.ewallet-lab.local` caller (curl scripts, prior tickets' verify
  # commands, anything not expecting a 308). The issue explicitly requires HTTP to keep working
  # unredirected alongside the new HTTPS.
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    shell: shell.ewallet-lab.local
    mfeAuth: mfe-auth.ewallet-lab.local
    mfeWallet: mfe-wallet.ewallet-lab.local
    mfeTopup: mfe-topup.ewallet-lab.local
    mfeTransfer: mfe-transfer.ewallet-lab.local
    mfeBillPayment: mfe-bill-payment.ewallet-lab.local
    api: api.ewallet-lab.local
  # Issue #41 — self-signed cert covering every host above, created OUT-OF-BAND (not by Helm/this
  # chart) via `kubectl create secret tls`, see deploy README's "TLS (issue #41)" section for the
  # exact `openssl req` + `kubectl create secret` commands to (re)generate it. Not templated as a
  # Helm-managed Secret on purpose: Helm has no built-in way to persist a stable keypair across
  # `helm upgrade` runs without either committing the private key to git (rejected — even a
  # self-signed key shouldn't sit in a public repo) or fighting Helm's own diffing with `lookup`
  # tricks; a plain `kubectl create secret` the operator/agent re-runs when the cert expires or the
  # host list changes is simpler and matches how `minikube tunnel` is already handled (documented
  # command, not automated).
  tlsSecretName: ewallet-lab-tls

# Same permissive-lab-CORS pattern as docker-compose (see each service's CorsConfig.java),
# just widened from localhost to the Ingress hostnames.
# Issue #41 (3rd layer): comma-separated list, each service's CorsConfig.java now does
# allowedOriginPattern.split(",") before passing to Spring's allowedOriginPatterns(String...)
# varargs — a single comma-joined string was being treated as ONE literal pattern (never
# matching), which is why adding TLS/https origins here previously still 403'd. Keep BOTH
# schemes: https for the new WebAuthn-required secure context, http so any caller still on the
# plain link (older bookmarks, prior tickets' curl scripts) keeps working.
# Issue #41 (4th layer): the plain `https://*.ewallet-lab.local` pattern above is an Ant-style
# wildcard anchored at both ends — it matches ONLY an origin with no port at all. This lab has no
# usable port 443 (binding it needs sudo, not always available), so the operator must reach
# Touch ID/WebAuthn via `kubectl port-forward ... 18443:443` and hit
# `https://shell.ewallet-lab.local:18443`, which the browser sends as
# `Origin: https://shell.ewallet-lab.local:18443` (WITH the port) — that origin 403'd even though
# the no-port form passed, because the no-port pattern's regex is anchored right after `.local`.
# Fixed by ADDING (not replacing) Spring's own documented optional-port syntax: appending
# `:[*]` to a pattern makes CorsConfiguration.OriginPattern treat the trailing `(:\d+)` as
# OPTIONAL (see CorsConfiguration$OriginPattern#initPattern / PORTS_PATTERN =
# `(.*):\[(\*|\d+(,\d+)*)]` in spring-web 6.1.x, matches Spring Boot 3.4.1's Spring Framework
# version) — verified by decompiling spring-web-6.1.3.jar and exercising
# CorsConfiguration.checkOrigin() directly with both forms before deploying. Keeping the original
# no-port patterns alongside the new `:[*]` ones is redundant (the `:[*]` form alone already
# matches both with- and without-port) but intentional, per the no-regression rule for CORS fixes
# on this ticket — a 5th reviewer should not have to re-derive that the old patterns are still
# safe to drop.
corsAllowedOriginPattern: "http://*.ewallet-lab.local,https://*.ewallet-lab.local,http://*.ewallet-lab.local:[*],https://*.ewallet-lab.local:[*]"

postgres:
  image: postgres:16
  storageSize: 1Gi
  storageClassName: ""   # "" = cluster default. Real EKS: a gp3 StorageClass, or better,
                          # skip this Deployment entirely and point DB_HOST at RDS instead.
  # Issue #24 — raised from Postgres's default 100. Budget: 10 Java services x
  # hikari.maximum-pool-size=5 = 50 max, doubled worst-case to 100 during a rolling restart
  # (old+new pod briefly both holding a full pool), plus headroom for admin psql/pgAdmin
  # sessions. 200 keeps real usage comfortably under 50% even at that worst case.
  maxConnections: 200
  user: postgres
  password: postgres     # lab-only plaintext Secret value — see values-eks.yaml note.

zookeeper:
  # Pinned, not :latest — the latest cp-kafka/cp-zookeeper images default to KRaft-only mode and
  # no longer honor ZOOKEEPER_*/KAFKA_ZOOKEEPER_CONNECT at all. 7.5.3 is the last widely-used line
  # that still runs classic Zookeeper mode with the env vars this chart sets. Same pin applied to
  # ../../docker-compose.yml, which hit the identical breakage.
  image: confluentinc/cp-zookeeper:7.5.3

kafka:
  image: confluentinc/cp-kafka:7.5.3

userService:
  port: 8090
  replicas: 1

walletService:
  port: 8091
  replicas: 1

topupService:
  port: 8092
  replicas: 1

mockBankGateway:
  port: 8093
  replicas: 1

# Issue #52 — the topup-service <-> mock-bank-gateway accessKey/secretKey pair is NOT configured here.
# It is read from the K8s Secret `bank-gateway-credentials`, created out-of-band with random values
# (see README "Tạo Secret bank-gateway-credentials"); no value is committed to the repo.

transferService:
  port: 8094
  replicas: 1

billPaymentService:
  port: 8095
  replicas: 1

paymentRequestService:
  port: 8096
  replicas: 1
  # Issue #3 Task step 2: "Requests should expire (define a TTL, e.g. 24h)" — LINK-only, see
  # PaymentRequestService.checkExpiry (REMINDER has no TTL, per issue #8's Acceptance criteria).
  paymentLinkTtlHours: 24

luckyMoneyService:
  port: 8097
  replicas: 1
  # Issue #10: MoMo's verified real 48h window before an unclaimed lucky money is auto-refunded —
  # configurable so the expiry behavior itself can be verified in seconds during testing.
  ttlHours: 48

bnplService:
  port: 8098
  replicas: 1
  # Issue #18 — MOCK "Ví Trả Sau". Fixed limit for every user (MoMo's published max), no scoring.
  creditLimit: 20000000
  # TEST ONLY: shifts bnpl-service's "now" forward N days to exercise due dates / late-fee tiers
  # without waiting a month (set, test, then revert to 0 — same pattern as the TTLs above).
  clockOffsetDays: 0

loyaltyService:
  port: 8099
  replicas: 1

# NOTE: originally also defaulted to port 8098 (a stashed branch that diverged from bnpl-service
# before either was committed/merged) — reassigned to 8100 to avoid colliding with bnplService.
familyWalletService:
  port: 8100
  replicas: 1

# NOTE: same stashed-branch collision as familyWalletService above (originally 8099, same as
# loyaltyService) — reassigned to 8101.
fundService:
  port: 8101
  replicas: 1

investmentFundService:
  port: 8102
  replicas: 1

# ADR-06 (DESIGN.md) — second, isolated async layer: SNS fan-out + SQS notification consumer,
# does NOT replace/route any existing Kafka/Outbox flow. Account id/ARNs are NOT secret (the
# account itself is already named in DESIGN.md's ADR-06); only the IAM access key pair is secret,
# and that lives in the k8s Secret `ewallet-lab-aws-notify` created out-of-band by the operator via
# scripts/init-aws-infra.sh (see that script + README for the exact kubectl command). Update these
# 2 ARNs/URL here if the operator ever re-runs the script against a different AWS account.
aws:
  region: ap-southeast-1
  snsTopicArn: "arn:aws:sns:ap-southeast-1:456021728709:ewallet-lab-payment-completed"
  notifyQueueUrl: "https://sqs.ap-southeast-1.amazonaws.com/456021728709/ewallet-lab-payment-completed-notify"

notificationService:
  port: 8103
  replicas: 1

frontend:
  port: 80
  replicas: 1

# Issue #53 (TD-01) — resource budget, ONE place. Memory sized from measured cgroup memory.current
# (2026-10-24, JVMs had unbounded heap) vs. node allocatable 8126672Ki (~7.75 GiB). Full table and
# reasoning: backend DESIGN.md "Ngân sách RAM". Rule: every new Deployment MUST add an entry here
# (the `ewallet-lab.resources` helper fails `helm template` if it is missing).
# CPU: requests only for Burstable pods (no CPU limit => no throttling during JVM startup);
# Guaranteed infra (postgres/kafka/zookeeper) has requests == limits for both.
jvm:
  # Heap = this % of the container memory LIMIT; the rest is metaspace, code cache, threads, direct buffers.
  maxRamPercentage: 60

resources:
  # ADR-06 (DESIGN.md): wallet-service now ALSO có phụ thuộc mạng ra AWS (SNS publish, best-effort,
  # sau khi commit); lỗi/timeout không chặn response, chỉ log WARN. Không phải container mới nên
  # không có entry resources riêng cho việc này — số liệu dưới đây không đổi vì #06.
  wallet-service:
    requests: { memory: 384Mi, cpu: 100m }
    limits: { memory: 640Mi }
  topup-service:
    requests: { memory: 320Mi, cpu: 100m }
    limits: { memory: 640Mi }
  user-service:
    requests: { memory: 256Mi, cpu: 50m }
    limits: { memory: 512Mi }
  transfer-service:
    requests: { memory: 256Mi, cpu: 50m }
    limits: { memory: 512Mi }
  bill-payment-service:
    requests: { memory: 256Mi, cpu: 50m }
    limits: { memory: 512Mi }
  bnpl-service:
    requests: { memory: 256Mi, cpu: 50m }
    limits: { memory: 512Mi }
  family-wallet-service:
    requests: { memory: 256Mi, cpu: 50m }
    limits: { memory: 512Mi }
  fund-service:
    requests: { memory: 256Mi, cpu: 50m }
    limits: { memory: 512Mi }
  investment-fund-service:
    requests: { memory: 256Mi, cpu: 50m }
    limits: { memory: 512Mi }
  loyalty-service:
    requests: { memory: 256Mi, cpu: 50m }
    limits: { memory: 512Mi }
  lucky-money-service:
    requests: { memory: 256Mi, cpu: 50m }
    limits: { memory: 512Mi }
  payment-request-service:
    requests: { memory: 256Mi, cpu: 50m }
    limits: { memory: 512Mi }
  postgres:
    requests: { memory: 512Mi, cpu: 500m }
    limits: { memory: 512Mi, cpu: 500m }
  kafka:
    requests: { memory: 640Mi, cpu: 500m }
    limits: { memory: 640Mi, cpu: 500m }
    heapOpts: "-Xms256m -Xmx384m"
  zookeeper:
    requests: { memory: 320Mi, cpu: 200m }
    limits: { memory: 320Mi, cpu: 200m }
    heapOpts: "-Xms64m -Xmx192m"
  mock-bank-gateway:
    requests: { memory: 32Mi, cpu: 20m }
    limits: { memory: 64Mi }
  # ADR-06 (DESIGN.md) — Go, same lightweight precedent as mock-bank-gateway, chosen specifically
  # so a brand-new Deployment does not worsen the RAM overcommit noted in "Ngân sách RAM" (limits
  # already ~192Mi over node allocatable before this service existed).
  notification-service:
    requests: { memory: 32Mi, cpu: 20m }
    limits: { memory: 64Mi }
  shell:
    requests: { memory: 16Mi, cpu: 10m }
    limits: { memory: 64Mi }
  mfe-auth:
    requests: { memory: 16Mi, cpu: 10m }
    limits: { memory: 64Mi }
  mfe-bill-payment:
    requests: { memory: 16Mi, cpu: 10m }
    limits: { memory: 64Mi }
  mfe-topup:
    requests: { memory: 16Mi, cpu: 10m }
    limits: { memory: 64Mi }
  mfe-transfer:
    requests: { memory: 16Mi, cpu: 10m }
    limits: { memory: 64Mi }
  mfe-wallet:
    requests: { memory: 16Mi, cpu: 10m }
    limits: { memory: 64Mi }

# Issue #54 (TD-02) — probe tuning that used to live only on the cluster (kubectl patch). Chart is now
# the source of truth. Applies to both readiness and liveness of the named Deployment.
probeOverrides:
  bnpl-service: { failureThreshold: 40 }
  family-wallet-service: { failureThreshold: 40, timeoutSeconds: 5 }
  fund-service: { failureThreshold: 40 }
  investment-fund-service: { failureThreshold: 40 }
  loyalty-service: { failureThreshold: 40 }
  lucky-money-service: { failureThreshold: 40 }
  payment-request-service: { failureThreshold: 20 }
  transfer-service: { failureThreshold: 20 }
  user-service: { failureThreshold: 20 }
  postgres: { timeoutSeconds: 5 }

# Issue #54 — per-Deployment replica override (name -> count). Empty by default (every template's own default).
replicaOverrides: {}

