# minikube profile — overrides values.yaml for local dev. Images are expected to already
# be built into minikube's own Docker daemon (`eval $(minikube docker-env)` before `docker
# build`), hence pullPolicy Never: nothing is ever pulled from a registry locally.
image:
  registry: ""
  pullPolicy: Never
  tag: local

ingress:
  className: nginx

# Issue #54 — deliberately scaled to 0 on the local cluster (minikube RAM). Do not bring them up silently:
# raise these to 1 only together with a RAM-budget check (DESIGN.md "Ngân sách RAM").
# notification-service (ADR-06): 0 by default for a SECOND reason beyond RAM — it long-polls a
# real AWS SQS queue 24/7 if left running, and ADR-06's cost note is explicit that empty long-polls
# running unattended for weeks can approach the SQS free-tier request quota on their own. Scale to
# 1 only while actively testing: `kubectl -n ewallet-lab scale deploy/notification-service --replicas=1`,
# then back to 0 when done (`--replicas=0`).
replicaOverrides:
  mock-bank-gateway: 0
  mfe-bill-payment: 0
  mfe-topup: 0
  notification-service: 0

