apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-bank-gateway
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ include "ewallet-lab.replicas" (dict "root" $ "name" "mock-bank-gateway" "default" .Values.mockBankGateway.replicas) }}
  selector:
    matchLabels: { app: mock-bank-gateway }
  template:
    metadata:
      labels: { app: mock-bank-gateway }
    spec:
      # Kubernetes injects <SVC>_PORT-style legacy Docker-links env vars for every
      # Service in the namespace by default; Confluent's cp-kafka entrypoint
      # misreads an injected KAFKA_PORT as a Kafka 'port' config property and
      # crashes. Disabling this (largely obsolete now that Service DNS exists)
      # avoids that class of bug everywhere, not just on kafka itself.
      enableServiceLinks: false
      containers:
        - name: mock-bank-gateway
          image: {{ include "ewallet-lab.image" (dict "root" $ "name" "mock-bank-gateway") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "ewallet-lab.resources" (dict "root" $ "name" "mock-bank-gateway") | nindent 10 }}
          ports:
            - containerPort: {{ .Values.mockBankGateway.port }}
          env:
            - name: HTTP_PORT
              value: {{ .Values.mockBankGateway.port | quote }}
            # Issue #52: same credential pair topup-service uses, from the same Secret — the gateway
            # signs the IPN with it and topup-service re-computes the signature with it, so the two
            # MUST get identical values. The gateway refuses to start without them.
            - name: BANK_GATEWAY_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: bank-gateway-credentials, key: BANK_GATEWAY_ACCESS_KEY } }
            - name: BANK_GATEWAY_SECRET_KEY
              valueFrom: { secretKeyRef: { name: bank-gateway-credentials, key: BANK_GATEWAY_SECRET_KEY } }
          readinessProbe:
            httpGet: { path: /healthz, port: {{ .Values.mockBankGateway.port }} }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: {{ .Values.mockBankGateway.port }} }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mock-bank-gateway
  namespace: {{ .Values.namespace }}
spec:
  selector: { app: mock-bank-gateway }
  ports:
    - port: {{ .Values.mockBankGateway.port }}
      targetPort: {{ .Values.mockBankGateway.port }}
