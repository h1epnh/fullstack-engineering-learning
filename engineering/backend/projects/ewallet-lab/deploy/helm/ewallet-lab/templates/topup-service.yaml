apiVersion: apps/v1
kind: Deployment
metadata:
  name: topup-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ include "ewallet-lab.replicas" (dict "root" $ "name" "topup-service" "default" .Values.topupService.replicas) }}
  selector:
    matchLabels: { app: topup-service }
  template:
    metadata:
      labels: { app: topup-service }
    spec:
      # Kubernetes injects <SVC>_PORT-style legacy Docker-links env vars for every
      # Service in the namespace by default; Confluent's cp-kafka entrypoint
      # misreads an injected KAFKA_PORT as a Kafka 'port' config property and
      # crashes. Disabling this (largely obsolete now that Service DNS exists)
      # avoids that class of bug everywhere, not just on kafka itself.
      enableServiceLinks: false
      containers:
        - name: topup-service
          image: {{ include "ewallet-lab.image" (dict "root" $ "name" "topup-service") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "ewallet-lab.resources" (dict "root" $ "name" "topup-service") | nindent 10 }}
          ports:
            - containerPort: {{ .Values.topupService.port }}
          env:
            - name: JAVA_TOOL_OPTIONS
              value: {{ include "ewallet-lab.javaToolOptions" . | quote }}
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: ewallet_topup
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_PASSWORD } }
            - name: KAFKA_BOOTSTRAP
              value: "kafka:9092"
            - name: BANK_GATEWAY_URL
              value: "http://mock-bank-gateway:{{ .Values.mockBankGateway.port }}"
            # Issue #52: the shared accessKey/secretKey pair. Injected from the bank-gateway-credentials
            # Secret (see templates/secret-postgres.yaml) — NOT hardcoded in the image. topup-service
            # refuses to start without them (see its application.yml: no default secret), so a missing
            # Secret surfaces as a CrashLoopBackOff with a clear message rather than a silent
            # signature mismatch at IPN time.
            - name: BANK_GATEWAY_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: bank-gateway-credentials, key: BANK_GATEWAY_ACCESS_KEY } }
            - name: BANK_GATEWAY_SECRET_KEY
              valueFrom: { secretKeyRef: { name: bank-gateway-credentials, key: BANK_GATEWAY_SECRET_KEY } }
            - name: WALLET_SERVICE_URL
              value: "http://wallet-service:{{ .Values.walletService.port }}"
            - name: USER_SERVICE_URL
              value: "http://user-service:{{ .Values.userService.port }}"
            # IPN is a server-to-server callback from mock-bank-gateway back to this service —
            # in-cluster Service DNS, not the public Ingress host.
            - name: SELF_BASE_URL
              value: "http://topup-service:{{ .Values.topupService.port }}"
            - name: ALLOWED_ORIGIN_PATTERN
              value: {{ .Values.corsAllowedOriginPattern | quote }}
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: {{ .Values.topupService.port }} }
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: {{ .Values.topupService.port }} }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: topup-service
  namespace: {{ .Values.namespace }}
spec:
  selector: { app: topup-service }
  ports:
    - port: {{ .Values.topupService.port }}
      targetPort: {{ .Values.topupService.port }}
