apiVersion: apps/v1
kind: Deployment
metadata:
  name: transfer-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ include "ewallet-lab.replicas" (dict "root" $ "name" "transfer-service" "default" .Values.transferService.replicas) }}
  selector:
    matchLabels: { app: transfer-service }
  template:
    metadata:
      labels: { app: transfer-service }
    spec:
      enableServiceLinks: false
      containers:
        - name: transfer-service
          image: {{ include "ewallet-lab.image" (dict "root" $ "name" "transfer-service") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "ewallet-lab.resources" (dict "root" $ "name" "transfer-service") | nindent 10 }}
          ports:
            - containerPort: {{ .Values.transferService.port }}
          env:
            - name: JAVA_TOOL_OPTIONS
              value: {{ include "ewallet-lab.javaToolOptions" . | quote }}
            - name: USER_SERVICE_URL
              value: "http://user-service:{{ .Values.userService.port }}"
            - name: WALLET_SERVICE_URL
              value: "http://wallet-service:{{ .Values.walletService.port }}"
            # Issue #54 / TD-13: DB_* used to exist only on the live cluster (kubectl set env, with a
            # plaintext password). Credentials now come from the postgres-credentials Secret.
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: ewallet_transfer
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_PASSWORD } }
            - name: ALLOWED_ORIGIN_PATTERN
              value: {{ .Values.corsAllowedOriginPattern | quote }}
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: {{ .Values.transferService.port }} }
            initialDelaySeconds: 10
            periodSeconds: 5
            {{- include "ewallet-lab.probeExtras" (dict "root" $ "name" "transfer-service") | nindent 12 }}
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: {{ .Values.transferService.port }} }
            initialDelaySeconds: 15
            periodSeconds: 10
            {{- include "ewallet-lab.probeExtras" (dict "root" $ "name" "transfer-service") | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: transfer-service
  namespace: {{ .Values.namespace }}
spec:
  selector: { app: transfer-service }
  ports:
    - port: {{ .Values.transferService.port }}
      targetPort: {{ .Values.transferService.port }}
