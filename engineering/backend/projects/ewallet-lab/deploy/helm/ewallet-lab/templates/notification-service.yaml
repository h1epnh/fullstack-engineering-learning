apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ include "ewallet-lab.replicas" (dict "root" $ "name" "notification-service" "default" .Values.notificationService.replicas) }}
  selector:
    matchLabels: { app: notification-service }
  template:
    metadata:
      labels: { app: notification-service }
    spec:
      # Kubernetes injects <SVC>_PORT-style legacy Docker-links env vars for every
      # Service in the namespace by default; Confluent's cp-kafka entrypoint
      # misreads an injected KAFKA_PORT as a Kafka 'port' config property and
      # crashes. Disabling this (largely obsolete now that Service DNS exists)
      # avoids that class of bug everywhere, not just on kafka itself.
      enableServiceLinks: false
      containers:
        - name: notification-service
          image: {{ include "ewallet-lab.image" (dict "root" $ "name" "notification-service") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "ewallet-lab.resources" (dict "root" $ "name" "notification-service") | nindent 10 }}
          ports:
            - containerPort: {{ .Values.notificationService.port }}
          # ADR-06 (DESIGN.md): AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_DEFAULT_REGION come
          # from the k8s Secret `ewallet-lab-aws-notify`, created out-of-band by the operator (NOT
          # by this chart, NOT by any agent) via scripts/init-aws-infra.sh's printed `kubectl
          # create secret` command — holds a scoped-down IAM user's key, never the admin profile's.
          envFrom:
            - secretRef:
                name: ewallet-lab-aws-notify
          env:
            - name: HTTP_PORT
              value: {{ .Values.notificationService.port | quote }}
            # Not secret — the queue's own URL (account id + fixed queue name from ADR-06's
            # naming). sqs:GetQueueUrl is deliberately NOT in the scoped IAM policy
            # (least-privilege — only Receive/Delete/GetAttributes on this exact queue), so the
            # URL has to be supplied directly rather than resolved by name at runtime.
            - name: SQS_QUEUE_URL
              value: {{ .Values.aws.notifyQueueUrl | quote }}
          readinessProbe:
            httpGet: { path: /healthz, port: {{ .Values.notificationService.port }} }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: {{ .Values.notificationService.port }} }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: {{ .Values.namespace }}
spec:
  selector: { app: notification-service }
  ports:
    - port: {{ .Values.notificationService.port }}
      targetPort: {{ .Values.notificationService.port }}
