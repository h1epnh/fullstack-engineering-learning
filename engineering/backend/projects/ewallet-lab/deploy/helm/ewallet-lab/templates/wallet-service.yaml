apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ include "ewallet-lab.replicas" (dict "root" $ "name" "wallet-service" "default" .Values.walletService.replicas) }}
  selector:
    matchLabels: { app: wallet-service }
  template:
    metadata:
      labels: { app: wallet-service }
    spec:
      # Kubernetes injects <SVC>_PORT-style legacy Docker-links env vars for every
      # Service in the namespace by default; Confluent's cp-kafka entrypoint
      # misreads an injected KAFKA_PORT as a Kafka 'port' config property and
      # crashes. Disabling this (largely obsolete now that Service DNS exists)
      # avoids that class of bug everywhere, not just on kafka itself.
      enableServiceLinks: false
      containers:
        - name: wallet-service
          image: {{ include "ewallet-lab.image" (dict "root" $ "name" "wallet-service") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "ewallet-lab.resources" (dict "root" $ "name" "wallet-service") | nindent 10 }}
          ports:
            - containerPort: {{ .Values.walletService.port }}
          # ADR-06 (DESIGN.md) — SNS publish-after-commit (PaymentNotificationPublisher): best-effort,
          # fire-and-forget, never blocks/fails a debit/credit response. AWS_ACCESS_KEY_ID/
          # AWS_SECRET_ACCESS_KEY/AWS_DEFAULT_REGION come from this Secret (same scoped-down IAM user
          # notification-service also uses), created out-of-band by the operator via
          # scripts/init-aws-infra.sh — NOT a new container, so no new `resources:` entry needed
          # here, just this one network dependency out to AWS (SNS publish; errors/timeouts never
          # block the response, only logged at WARN — see "Ngân sách RAM" table's note on this).
          envFrom:
            - secretRef:
                name: ewallet-lab-aws-notify
          env:
            - name: JAVA_TOOL_OPTIONS
              value: {{ include "ewallet-lab.javaToolOptions" . | quote }}
            - name: SNS_TOPIC_ARN
              value: {{ .Values.aws.snsTopicArn | quote }}
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: ewallet_wallet
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_PASSWORD } }
            - name: KAFKA_BOOTSTRAP
              value: "kafka:9092"
            - name: FAMILY_WALLET_SERVICE_URL
              value: "http://family-wallet-service:{{ .Values.familyWalletService.port }}"
            - name: USER_SERVICE_URL
              value: "http://user-service:{{ .Values.userService.port }}"
            - name: ALLOWED_ORIGIN_PATTERN
              value: {{ .Values.corsAllowedOriginPattern | quote }}
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: {{ .Values.walletService.port }} }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: {{ .Values.walletService.port }} }
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: wallet-service
  namespace: {{ .Values.namespace }}
spec:
  selector: { app: wallet-service }
  ports:
    - port: {{ .Values.walletService.port }}
      targetPort: {{ .Values.walletService.port }}
