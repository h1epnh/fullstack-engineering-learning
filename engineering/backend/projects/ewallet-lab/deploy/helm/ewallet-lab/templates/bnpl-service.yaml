apiVersion: apps/v1
kind: Deployment
metadata:
  name: bnpl-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ include "ewallet-lab.replicas" (dict "root" $ "name" "bnpl-service" "default" .Values.bnplService.replicas) }}
  selector:
    matchLabels: { app: bnpl-service }
  template:
    metadata:
      labels: { app: bnpl-service }
    spec:
      # Kubernetes injects <SVC>_PORT-style legacy Docker-links env vars for every
      # Service in the namespace by default; Confluent's cp-kafka entrypoint
      # misreads an injected KAFKA_PORT as a Kafka 'port' config property and
      # crashes. Disabling this (largely obsolete now that Service DNS exists)
      # avoids that class of bug everywhere, not just on kafka itself.
      enableServiceLinks: false
      containers:
        - name: bnpl-service
          image: {{ include "ewallet-lab.image" (dict "root" $ "name" "bnpl-service") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "ewallet-lab.resources" (dict "root" $ "name" "bnpl-service") | nindent 10 }}
          ports:
            - containerPort: {{ .Values.bnplService.port }}
          env:
            - name: JAVA_TOOL_OPTIONS
              value: {{ include "ewallet-lab.javaToolOptions" . | quote }}
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: ewallet_bnpl
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_PASSWORD } }
            - name: WALLET_SERVICE_URL
              value: "http://wallet-service:{{ .Values.walletService.port }}"
            - name: BNPL_CREDIT_LIMIT
              value: "{{ .Values.bnplService.creditLimit }}"
            - name: BNPL_CLOCK_OFFSET_DAYS
              value: "{{ .Values.bnplService.clockOffsetDays }}"
            - name: ALLOWED_ORIGIN_PATTERN
              value: {{ .Values.corsAllowedOriginPattern | quote }}
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: {{ .Values.bnplService.port }} }
            initialDelaySeconds: 15
            periodSeconds: 5
            {{- include "ewallet-lab.probeExtras" (dict "root" $ "name" "bnpl-service") | nindent 12 }}
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: {{ .Values.bnplService.port }} }
            initialDelaySeconds: 20
            periodSeconds: 10
            {{- include "ewallet-lab.probeExtras" (dict "root" $ "name" "bnpl-service") | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: bnpl-service
  namespace: {{ .Values.namespace }}
spec:
  selector: { app: bnpl-service }
  ports:
    - port: {{ .Values.bnplService.port }}
      targetPort: {{ .Values.bnplService.port }}
