  tls:
    - hosts:
        - {{ .Values.ingress.hosts.api }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.hosts.api }}
      http:
        paths:
          - path: /users
            pathType: Prefix
            backend:
              service: { name: user-service, port: { number: 8090 } }
