# NOTE (issue #52): the bank-gateway-credentials Secret is deliberately NOT rendered by this chart —
# no secret value may live in values/repo. Create it out-of-band, see README "Tạo Secret bank-gateway-credentials".
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
