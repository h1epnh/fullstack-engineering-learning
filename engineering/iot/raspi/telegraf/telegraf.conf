[agent]
  interval = "10s"
  flush_interval = "10s"

[[inputs.mqtt_consumer]]
  servers = ["tcp://localhost:1883"]
  topics = ["sensors/esp8266/temperature"]
  data_format = "value"
  data_type = "float"
  name_override = "temperature"

[[inputs.mqtt_consumer]]
  servers = ["tcp://localhost:1883"]
  topics = ["sensors/esp8266/humidity"]
  data_format = "value"
  data_type = "float"
  name_override = "humidity"

[[inputs.mqtt_consumer]]
  servers = ["tcp://localhost:1883"]
  topics = ["sensors/esp8266/motion"]
  data_format = "value"
  data_type = "integer"
  name_override = "motion"

[[outputs.influxdb_v2]]
  urls = ["http://localhost:8086"]
  token = "REPLACE_WITH_YOUR_INFLUXDB_TOKEN"
  organization = "esp8266-lab"
  bucket = "sensors"
