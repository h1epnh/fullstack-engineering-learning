<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="ui.css" />
    <style>
      body { width: 300px; padding: 12px; }
      header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
      header h1 { flex: 1; font-size: 15px; margin: 0; }
      header .state { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; }

      .status { display: flex; gap: 10px; align-items: center; padding: 10px 12px; margin-bottom: 10px; }
      .status .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--off); }
      .status strong { display: block; font-size: 14px; }
      .status[data-state="lan"] .dot { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 25%, transparent); }
      .status[data-state="fallback"] .dot { background: var(--warn); }
      .status[data-state="blocked"] .dot { background: var(--bad); }

      dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0 2px 10px; }
      dt { color: var(--muted); }
      dd { margin: 0; text-align: right; word-break: break-all; }

      .err { color: var(--bad); font-size: 12px; margin: 0 2px 10px; }
      footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 10px; }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon-48.png" alt="" width="22" height="22" />
      <h1>HDB Proxy</h1>
      <span class="state" id="stateLabel">ON</span>
      <label class="switch" title="Turn HDB Proxy on or off">
        <input type="checkbox" id="enabled" aria-label="Enable HDB Proxy" />
        <span class="track"></span>
      </label>
    </header>

    <section class="status card" id="status" data-state="off">
      <span class="dot"></span>
      <div>
        <strong id="statusTitle">Checking…</strong>
        <small id="statusDetail"></small>
      </div>
    </section>

    <dl>
      <dt>This tab</dt><dd id="tab">–</dd>
      <dt>LAN DNS</dt><dd id="dns">–</dd>
      <dt>Domains</dt><dd id="domains">–</dd>
    </dl>

    <p class="err" id="error" hidden></p>

    <footer>
      <button id="refresh">↻ Re-check</button>
      <button id="options" class="link">Settings</button>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
